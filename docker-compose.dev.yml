services:
  portfolio:
    image: node:20-alpine
    working_dir: /app
    container_name: porto-web-dev
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3005"
    ports:
      - "3005:3005"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
